name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyQt6 (no QGIS) lets tests/test_qt6_compat.py prove every Qt name the
      # sources spell exists in the binding QGIS 4 is built on.
      - name: Install numpy (analysis cores), linters and PyQt6
        run: python -m pip install --upgrade numpy flake8 pyflakes PyQt6

      # Every tests/test_*.py is discovered; QGIS-gated modules skip themselves.
      - name: Unit tests (QGIS-free)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Release identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag_date="$(git for-each-ref --format='%(taggerdate:short)' "refs/tags/${GITHUB_REF_NAME}")"
            if [[ -z "${tag_date}" ]]; then
              tag_date="$(git show -s --format=%cs "${GITHUB_REF_NAME}^{commit}")"
            fi
            python scripts/check_release_identity.py \
              --release-tag "${GITHUB_REF_NAME}" \
              --release-date "${tag_date}"
          else
            python scripts/check_release_identity.py
          fi

      # Blocking set: syntax errors (E9) and undefined names (F82).
      - name: flake8 (blocking - syntax + undefined names)
        run: flake8 --select=E9,F63,F7,F82 --show-source .

      # Non-blocking: surfaces pre-existing style debt without failing the build.
      - name: flake8 (full project config, informational)
        continue-on-error: true
        run: flake8 .

      - name: Static smoke test
        run: python tests/check_static.py

  qgis-tests:
    # The QGIS-gated tests (align/export warps, dialog memory, layer tree) run
    # for real inside the official QGIS image, headless.
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:release-3_34
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests under the QGIS Python
        run: |
          python3 --version
          python3 -c "from qgis.core import Qgis; print('QGIS', Qgis.QGIS_VERSION)"
          python3 -m unittest discover -s tests -p "test_*.py" -v
